name: pset3-experimentos

services:
  mlflow:
    image: ghcr.io/mlflow/mlflow:v3.18.0-full
    restart: unless-stopped
    mem_limit: 768m
    cpus: 1.0
    command:
      - mlflow
      - server
      - --host
      - 0.0.0.0
      - --port
      - "5000"
      - --workers
      - "1"
      - --backend-store-uri
      - sqlite:////mlflow/backend/mlflow.db
      - --registry-store-uri
      - sqlite:////mlflow/backend/mlflow.db
      - --serve-artifacts
      - --artifacts-destination
      - /mlflow/artifacts
      - --allowed-hosts
      - localhost:*,127.0.0.1:*
      - --cors-allowed-origins
      - http://localhost:${PSET3_NEW_MLFLOW_PORT:-5002},http://127.0.0.1:${PSET3_NEW_MLFLOW_PORT:-5002}
    ports:
      - "127.0.0.1:${PSET3_NEW_MLFLOW_PORT:-5002}:5000"
    environment:
      MLFLOW_DISABLE_TELEMETRY: "true"
      MLFLOW_SERVER_ENABLE_JOB_EXECUTION: "false"
      OMP_NUM_THREADS: "2"
      OPENBLAS_NUM_THREADS: "2"
      MKL_NUM_THREADS: "2"
    volumes:
      - mlflow_backend:/mlflow/backend
      - mlflow_artifacts:/mlflow/artifacts
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5000/health', timeout=3).read()"
      interval: 20s
      timeout: 5s
      retries: 6
      start_period: 30s
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  mlflow_backend:
  mlflow_artifacts:
