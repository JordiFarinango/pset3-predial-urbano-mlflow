name: pset3-ml

services:
  mlflow:
    image: ghcr.io/mlflow/mlflow:v3.18.0-full
    restart: unless-stopped
    command:
      - mlflow
      - server
      - --host
      - 0.0.0.0
      - --port
      - "5000"
      - --workers
      - "1"
      - --backend-store-uri
      - sqlite:////mlflow/backend/mlflow.db
      - --registry-store-uri
      - sqlite:////mlflow/backend/mlflow.db
      - --serve-artifacts
      - --artifacts-destination
      - /mlflow/artifacts
      - --allowed-hosts
      - localhost:*,127.0.0.1:*
      - --cors-allowed-origins
      - http://localhost:${MLFLOW_PORT:-5001},http://127.0.0.1:${MLFLOW_PORT:-5001}
    ports:
      - "127.0.0.1:${MLFLOW_PORT:-5001}:5000"
    environment:
      MLFLOW_DISABLE_TELEMETRY: "true"
    volumes:
      - mlflow_backend:/mlflow/backend
      - mlflow_artifacts:/mlflow/artifacts
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5000/health', timeout=3).read()"
      interval: 20s
      timeout: 5s
      retries: 6
      start_period: 30s
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  mlflow_backend:
  mlflow_artifacts:
